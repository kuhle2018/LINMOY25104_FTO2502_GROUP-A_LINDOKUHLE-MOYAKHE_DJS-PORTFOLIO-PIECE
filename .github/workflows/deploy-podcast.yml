name: Deploy podcast app

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Podcast-app/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix Podcast-app

      - name: Lint
        run: npm run lint --prefix Podcast-app

      - name: Build
        run: npm run build --prefix Podcast-app

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Podcast-app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
